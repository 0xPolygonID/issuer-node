name: Checks

on: [push]

jobs:
  test:
    name: Test codebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create .env-issuer and .env-ui files
        run: |
          touch .env-issuer
          touch .env-ui
      - name: Docker Compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        with:
          compose-file: './infrastructure/local/docker-compose-infra.yml'
          services: |
            postgres
            vault
            test_local_files_apache
            localstack

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: make tests
        env:
          POSTGRES_TEST_DATABASE: postgres://postgres:postgres@localhost:5432

  # Chained here because workflow_run triggers are disabled by repo policy.
  dockerhub-dev:
    needs: test
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/dockerhub-dev.yml
    secrets: inherit

  dockerhub-main:
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dockerhub-main.yml
    secrets: inherit

  deploy-backend:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/deploy_backend.yml
    secrets: inherit
